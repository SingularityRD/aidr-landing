# A flat (npm-style) node_modules. Turbopack loads server external packages (firebase-admin, pino)
# through `.next/node_modules/<pkg>-<hash>` links. With pnpm's isolated layout a package's own
# dependencies live only as siblings inside node_modules/.pnpm, so a deployment that copies those
# links as directories (instead of preserving them) cannot resolve them and every route that loads
# firebase-admin or pino fails with an empty 500. A flat layout keeps them resolvable from
# /node_modules either way. scripts/verify-server-bundle.mjs enforces this after every build.
nodeLinker: hoisted

overrides:
  '@fastify/busboy@<3.2.1': ^3.2.1
  '@grpc/grpc-js@<1.14.5': ^1.14.5
  '@protobufjs/utf8@<=1.1.0': '>=1.1.1'
  '@tootallnate/once@<2.0.1': '>=2.0.1'
  brace-expansion@>=5.0.0 <5.0.6: '>=5.0.6'
  fast-uri@<=3.1.0: '>=3.1.1'
  fast-uri@<=3.1.1: '>=3.1.2'
  fast-xml-builder@<=1.1.6: '>=1.1.7'
  fast-xml-builder@=1.1.5: '>=1.1.6'
  js-cookie@<=3.0.5: '>=3.0.7'
  postcss@<8.5.10: '>=8.5.10'
  protobufjs@<=7.5.5: '>=7.5.6'
  protobufjs@<=7.5.7: '>=7.5.8'
  uuid@<11.1.1: '>=11.1.1'
